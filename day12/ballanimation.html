<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div class="balls">
      <div class="ball" style="animation-delay: 0.2s;"></div>
      <div class="ball" style="animation-delay: 0.4s;"></div>
      <div class="ball" style="animation-delay: 0.6s;"></div>
      <div class="ball" style="animation-delay: 0.8s;"></div>
      <div class="ball" style="animation-delay: 1s;"></div>
      <div class="ball" style="animation-delay: 1.2s;"></div>
      <div class="ball" style="animation-delay: 1.4s;"></div>
      <div class="ball" style="animation-delay: 1.6s;"></div>
    </div>

    <style>
      .ball {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        margin-right: 10px;
        background-color: brown;

        animation: bounce 1s infinite alternate ease-in;
        /* animation-delay: 5s; */
      }
      .balls {
        display: flex;
      }
      @keyframes bounce {
        from {
          transform: translateY(0);
        }
        to {
          transform: translateY(200px);
        }
      }
    </style>
  </body>
</html>
